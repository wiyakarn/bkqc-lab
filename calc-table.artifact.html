<title>ตารางคำนวณสูตรอัตโนมัติ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap">
<style>
:root{--bg:#f4f3ef;--sur:#fff;--sur2:#fffdf5;--brd:#d0cec4;--tx:#1a1916;--tx2:#6b6860;--grn:#1d6f42;--grn2:#e8f3ed;--blu2:#e8f0fa;--blu3:#dbe7f7;--red:#c0392b;--amb2:#fef8ec;--onacc:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17191a;--sur:#202324;--sur2:#2a2d2a;--brd:#3a3e3c;--tx:#ecebe6;--tx2:#a2a198;--grn:#4cb07e;--grn2:#1f3328;--blu2:#1f2d3f;--blu3:#26394f;--red:#ef7b6e;--amb2:#3a3220;--onacc:#10170f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17191a;--sur:#202324;--sur2:#2a2d2a;--brd:#3a3e3c;--tx:#ecebe6;--tx2:#a2a198;--grn:#4cb07e;--grn2:#1f3328;--blu2:#1f2d3f;--blu3:#26394f;--red:#ef7b6e;--amb2:#3a3220;--onacc:#10170f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font-family:Sarabun,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:16px}
h1{font-size:20px;margin:0 0 2px;color:var(--grn)}
.sub{color:var(--tx2);font-size:12px;margin-bottom:12px}
.card{background:var(--sur);border:1px solid var(--brd);border-radius:10px;padding:12px;margin-bottom:12px}
.add{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;align-items:end}
.add>*{min-width:0}
label{font-size:11px;color:var(--tx2);display:block}
input[type=text],input[type=number]{width:100%;padding:7px 8px;border:1px solid var(--brd);border-radius:6px;font:inherit;background:var(--sur2);color:var(--tx)}
button{font:inherit;padding:7px 12px;border:1px solid var(--brd);border-radius:6px;background:var(--sur);color:var(--tx);cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--grn);outline-offset:1px}
button.p{background:var(--grn);color:var(--onacc);border-color:var(--grn)}
button.d{color:var(--red);border-color:var(--red)}
button:disabled{opacity:.4;cursor:default}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.bar .sp{flex:1}
.chk{display:flex;gap:4px;align-items:center;font-size:13px;color:var(--tx)}
.cnt{font-size:12px;color:var(--tx2)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{background:var(--grn);color:var(--onacc);font-weight:600;padding:7px 8px;font-size:12px;white-space:nowrap}
td{border:1px solid var(--brd);padding:5px 8px}
td.n{text-align:right;font-variant-numeric:tabular-nums}
td.f{background:var(--blu2)}
.fx{display:block;font:11px/1.2 ui-monospace,Menlo,monospace;color:var(--tx2)}
tr.sel td{background:var(--amb2)}tr.sel td.f{background:var(--blu3)}
tfoot td{background:var(--grn2);font-weight:700}
h2{font-size:15px;margin:0 0 8px}
.empty{text-align:center;color:var(--tx2);padding:18px}
.msg{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--amb2);border:1px solid var(--brd);margin-bottom:8px}
.msg[hidden]{display:none}
.msg span{flex:1;min-width:160px}
#pdfbox{position:fixed;left:-10000px;top:0;width:760px;padding:24px;background:#fff;color:#111;font-family:Sarabun,"Noto Sans Thai",sans-serif;font-size:13px}
#pdfbox table{width:100%}#pdfbox th{background:#1d6f42;color:#fff}#pdfbox td{border-color:#bbb;color:#111;background:#fff}
#pdfbox td.f{background:#e8f0fa}#pdfbox tfoot td{background:#e8f3ed}#pdfbox h2{color:#1d6f42;font-size:17px}
@media(max-width:700px){.add{grid-template-columns:1fr 1fr}.add>div:first-child{grid-column:1/-1}}
</style>
<div class="wrap">
<h1>ตารางคำนวณสูตรอัตโนมัติ</h1>
<div class="sub">พิมพ์ชื่อสินค้า แล้วระบบคำนวณยอดให้ · ติ๊กเลือกหลายรายการเพื่อรวม ลบ หรือดาวน์โหลด · ข้อมูลเก็บในเบราว์เซอร์ของคุณเอง</div>
<div class="card add">
  <div><label for="n">ชื่อสินค้า</label><input type="text" id="n" list="names" placeholder="พิมพ์หรือเลือกชื่อสินค้า" autocomplete="off"><datalist id="names"></datalist></div>
  <div><label for="q">จำนวน</label><input type="number" id="q" min="0" step="any" value="1"></div>
  <div><label for="p">ราคา/หน่วย</label><input type="number" id="p" min="0" step="any" value="0"></div>
  <div><label for="d">ส่วนลด %</label><input type="number" id="d" min="0" max="100" step="any" value="0"></div>
  <button class="p" id="addBtn">+ เพิ่ม</button>
</div>
<div class="card">
  <div class="msg" id="msg" hidden><span id="msgt"></span><button class="d" id="msgok" hidden>ลบเลย</button><button id="msgno">ปิด</button></div>
  <div class="bar">
    <label class="chk"><input type="checkbox" id="all"> เลือกทั้งหมด</label>
    <span class="cnt" id="cnt"></span><span class="sp"></span>
    <label class="chk"><input type="checkbox" id="fx" checked> แสดงสูตร</label>
    <button class="d" id="del" disabled>ลบที่เลือก</button>
    <button id="xls">⬇ Excel</button>
    <button id="pdf">⬇ PDF</button>
  </div>
  <div class="scroll"><table>
    <thead><tr><th style="width:34px"></th><th>#</th><th>ชื่อสินค้า</th><th>จำนวน</th><th>ราคา/หน่วย</th><th>ส่วนลด %</th><th>รวม (คำนวณ)</th><th style="width:50px"></th></tr></thead>
    <tbody id="rows"></tbody><tfoot id="foot"></tfoot>
  </table></div>
</div>
<div class="card">
  <h2>รวมตามชื่อสินค้า (เฉพาะที่เลือก ถ้าไม่เลือกจะรวมทั้งหมด)</h2>
  <div class="scroll"><table>
    <thead><tr><th>ชื่อสินค้า</th><th>จำนวนรายการ</th><th>รวมจำนวน</th><th>รวมเป็นเงิน</th></tr></thead>
    <tbody id="grp"></tbody><tfoot id="gfoot"></tfoot>
  </table></div>
</div>
<div id="pdfbox"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const KEY="calcTable.v1";
let items=[],sel=new Set(),pendingDel=null;
try{items=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){}
if(!items.length)items=[{id:1,n:"ตัวอย่าง: ข้าวโพดหวาน",q:2,p:45,d:0},{id:2,n:"ตัวอย่าง: มันฝรั่งทอด",q:3,p:120,d:10},{id:3,n:"ตัวอย่าง: ข้าวโพดหวาน",q:1,p:45,d:0}];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}};
const fmt=n=>n.toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtq=n=>n.toLocaleString("th-TH",{maximumFractionDigits:4});
const total=i=>i.q*i.p*(1-i.d/100);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const chosen=()=>sel.size?items.filter(i=>sel.has(i.id)):items;

function render(){
  const showFx=$("fx").checked;
  $("names").innerHTML=[...new Set(items.map(i=>i.n))].map(n=>`<option value="${esc(n)}">`).join("");
  $("rows").innerHTML=items.length?items.map((it,k)=>{
    const r=k+2;
    return `<tr class="${sel.has(it.id)?"sel":""}">
      <td class="hidecol"><input type="checkbox" data-id="${it.id}" ${sel.has(it.id)?"checked":""}></td>
      <td>${k+1}</td><td>${esc(it.n)}</td>
      <td class="n">${fmtq(it.q)}</td><td class="n">${fmt(it.p)}</td><td class="n">${fmtq(it.d)}</td>
      <td class="n f">${fmt(total(it))}${showFx?`<span class="fx">=B${r}*C${r}*(1-D${r}/100)</span>`:""}</td>
      <td class="hidecol"><button data-del="${it.id}" class="d" style="padding:2px 8px">✕</button></td></tr>`}).join("")
    :`<tr><td colspan="8" class="empty">ยังไม่มีรายการ — เพิ่มสินค้าด้านบน</td></tr>`;
  const all=items.length;
  const sumAll=items.reduce((s,i)=>s+total(i),0);
  $("foot").innerHTML=all?`<tr><td class="hidecol"></td><td colspan="2">รวมทั้งหมด ${all} รายการ</td><td class="n">${fmtq(items.reduce((s,i)=>s+i.q,0))}</td><td></td><td></td><td class="n">${fmt(sumAll)}${showFx?`<span class="fx">=SUM(E2:E${all+1})</span>`:""}</td><td class="hidecol"></td></tr>`:"";
  $("cnt").textContent=sel.size?`เลือก ${sel.size} จาก ${all} รายการ`:`ทั้งหมด ${all} รายการ`;
  $("del").disabled=!sel.size;
  $("all").checked=all>0&&sel.size===all;
  // group summary
  const c=chosen(),g={};
  c.forEach(i=>{const x=g[i.n]||(g[i.n]={n:i.n,c:0,q:0,t:0});x.c++;x.q+=i.q;x.t+=total(i)});
  const gs=Object.values(g);
  $("grp").innerHTML=gs.length?gs.map(x=>`<tr><td>${esc(x.n)}</td><td class="n">${x.c}</td><td class="n">${fmtq(x.q)}</td><td class="n f">${fmt(x.t)}${showFx?`<span class="fx">=SUMIF(ชื่อสินค้า,"${esc(x.n)}",รวม)</span>`:""}</td></tr>`).join(""):`<tr><td colspan="4" class="empty">—</td></tr>`;
  $("gfoot").innerHTML=gs.length?`<tr><td>รวม</td><td class="n">${c.length}</td><td class="n">${fmtq(c.reduce((s,i)=>s+i.q,0))}</td><td class="n">${fmt(c.reduce((s,i)=>s+total(i),0))}</td></tr>`:"";
}

function add(){
  const n=$("n").value.trim();if(!n){$("n").focus();return}
  const num=id=>Math.max(0,parseFloat($(id).value)||0);
  items.push({id:Date.now()+Math.random(),n,q:num("q"),p:num("p"),d:Math.min(100,num("d"))});
  save();$("n").value="";$("n").focus();render();
}
$("addBtn").onclick=add;
["n","q","p","d"].forEach(id=>$(id).addEventListener("keydown",e=>{if(e.key==="Enter")add()}));
$("fx").onchange=render;
$("all").onchange=e=>{sel=e.target.checked?new Set(items.map(i=>i.id)):new Set();render()};
$("rows").addEventListener("change",e=>{const id=e.target.dataset.id;if(id==null)return;const k=+id;e.target.checked?sel.add(k):sel.delete(k);render()});
function note(t,ok){$("msgt").textContent=t;$("msgok").hidden=!ok;$("msg").hidden=false}
$("msgno").onclick=()=>{pendingDel=null;$("msg").hidden=true};
$("msgok").onclick=()=>{if(pendingDel){items=items.filter(i=>!pendingDel.has(i.id));pendingDel.forEach(id=>sel.delete(id));save();pendingDel=null}$("msg").hidden=true;render()};
$("rows").addEventListener("click",e=>{const id=e.target.dataset.del;if(id==null)return;pendingDel=new Set([+id]);note("ลบรายการนี้ใช่ไหม",true)});
$("del").onclick=()=>{pendingDel=new Set(sel);note(`ลบ ${sel.size} รายการที่เลือกใช่ไหม`,true)};

// ---- Excel: real formulas (rows = selected, or all when none selected) ----
$("xls").onclick=()=>{
  const c=chosen();if(!c.length){note("ยังไม่มีรายการ",false);return}
  const ws={},L=c.length;
  ["ชื่อสินค้า","จำนวน","ราคา/หน่วย","ส่วนลด %","รวม"].forEach((h,k)=>ws[String.fromCharCode(65+k)+"1"]={t:"s",v:h});
  c.forEach((it,k)=>{const r=k+2;
    ws["A"+r]={t:"s",v:it.n};ws["B"+r]={t:"n",v:it.q};ws["C"+r]={t:"n",v:it.p};ws["D"+r]={t:"n",v:it.d};
    ws["E"+r]={t:"n",v:total(it),f:`B${r}*C${r}*(1-D${r}/100)`,z:"#,##0.00"}});
  const tr=L+2;ws["A"+tr]={t:"s",v:"รวมทั้งหมด"};
  ws["B"+tr]={t:"n",v:c.reduce((s,i)=>s+i.q,0),f:`SUM(B2:B${L+1})`};
  ws["E"+tr]={t:"n",v:c.reduce((s,i)=>s+total(i),0),f:`SUM(E2:E${L+1})`,z:"#,##0.00"};
  ws["!ref"]=`A1:E${tr}`;ws["!cols"]=[{wch:50},{wch:10},{wch:14},{wch:10},{wch:16}];
  // grouped sheet using SUMIF over the detail sheet
  const names=[...new Set(c.map(i=>i.n))],g={};
  names.forEach(n=>g[n]=c.filter(i=>i.n===n));
  const w2={"!cols":[{wch:50},{wch:14},{wch:12},{wch:16}]};
  ["ชื่อสินค้า","จำนวนรายการ","รวมจำนวน","รวมเป็นเงิน"].forEach((h,k)=>w2[String.fromCharCode(65+k)+"1"]={t:"s",v:h});
  const R=`รายการ!$A$2:$A$${L+1}`;
  names.forEach((n,k)=>{const r=k+2,a=g[n];
    w2["A"+r]={t:"s",v:n};
    w2["B"+r]={t:"n",v:a.length,f:`COUNTIF(${R},A${r})`};
    w2["C"+r]={t:"n",v:a.reduce((s,i)=>s+i.q,0),f:`SUMIF(${R},A${r},รายการ!$B$2:$B$${L+1})`};
    w2["D"+r]={t:"n",v:a.reduce((s,i)=>s+total(i),0),f:`SUMIF(${R},A${r},รายการ!$E$2:$E$${L+1})`,z:"#,##0.00"}});
  const gt=names.length+2;w2["A"+gt]={t:"s",v:"รวม"};
  [["B",c.length],["C",c.reduce((s,i)=>s+i.q,0)],["D",c.reduce((s,i)=>s+total(i),0)]].forEach(([col,v])=>
    w2[col+gt]={t:"n",v,f:`SUM(${col}2:${col}${gt-1})`,z:col==="D"?"#,##0.00":undefined});
  w2["!ref"]=`A1:D${gt}`;
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"รายการ");XLSX.utils.book_append_sheet(wb,w2,"รวมตามสินค้า");
  saveFile(`ตารางคำนวณ_${new Date().toISOString().slice(0,10)}.xlsx`,XLSX.write(wb,{bookType:"xlsx",type:"array"}));
};

// ---- PDF: render chosen rows to an image, place on A4 pages ----
$("pdf").onclick=async()=>{
  const c=chosen();if(!c.length){note("ยังไม่มีรายการ",false);return}
  const g={};c.forEach(i=>{const x=g[i.n]||(g[i.n]={c:0,q:0,t:0});x.c++;x.q+=i.q;x.t+=total(i)});
  const rows=c.map((i,k)=>`<tr><td>${k+1}</td><td>${esc(i.n)}</td><td class="n">${fmtq(i.q)}</td><td class="n">${fmt(i.p)}</td><td class="n">${fmtq(i.d)}</td><td class="n f">${fmt(total(i))}</td></tr>`).join("");
  const grows=Object.entries(g).map(([n,x])=>`<tr><td>${esc(n)}</td><td class="n">${x.c}</td><td class="n">${fmtq(x.q)}</td><td class="n f">${fmt(x.t)}</td></tr>`).join("");
  $("pdfbox").innerHTML=`<h2>รายการสินค้า ${new Date().toLocaleDateString("th-TH")} (${c.length} รายการ)</h2>
  <table><thead><tr><th>#</th><th>ชื่อสินค้า</th><th>จำนวน</th><th>ราคา/หน่วย</th><th>ส่วนลด %</th><th>รวม</th></tr></thead><tbody>${rows}</tbody>
  <tfoot><tr><td colspan="5">รวมทั้งหมด</td><td class="n">${fmt(c.reduce((s,i)=>s+total(i),0))}</td></tr></tfoot></table>
  <h2 style="margin-top:18px">รวมตามชื่อสินค้า</h2>
  <table><thead><tr><th>ชื่อสินค้า</th><th>รายการ</th><th>รวมจำนวน</th><th>รวมเป็นเงิน</th></tr></thead><tbody>${grows}</tbody></table>`;
  try{
    await (document.fonts&&document.fonts.ready);
    const cv=await html2canvas($("pdfbox"),{scale:2,backgroundColor:"#ffffff"});
    const {jsPDF}=window.jspdf,pdf=new jsPDF({unit:"mm",format:"a4"});
    const W=210,H=297,m=10,w=W-2*m,h=cv.height*w/cv.width,ph=H-2*m;
    const pxPer=cv.height/h;let y=0;
    while(y<h){
      const sliceH=Math.min(ph,h-y),part=document.createElement("canvas");
      part.width=cv.width;part.height=Math.round(sliceH*pxPer);
      part.getContext("2d").drawImage(cv,0,Math.round(y*pxPer),cv.width,part.height,0,0,cv.width,part.height);
      if(y>0)pdf.addPage();
      pdf.addImage(part.toDataURL("image/jpeg",.92),"JPEG",m,m,w,sliceH);
      y+=ph;
    }
    await saveFile(`ตารางคำนวณ_${new Date().toISOString().slice(0,10)}.pdf`,pdf.output("arraybuffer"));
  }catch(e){note("สร้าง PDF ไม่สำเร็จ ลองอีกครั้ง",false)}
  $("pdfbox").innerHTML="";
};
async function saveFile(name,data){
  let dl=null;try{dl=await claude.use("downloads")}catch(e){}
  if(!dl){note("มุมมองนี้ดาวน์โหลดไฟล์ไม่ได้ ลองเปิดจากหน้า claude.ai",false);return}
  try{await dl.save({filename:name,data});note("บันทึกไฟล์แล้ว: "+name,false)}
  catch(e){if(e&&e.code!=="declined")note("ดาวน์โหลดไม่สำเร็จ ("+(e&&e.code||"error")+")",false)}
}
render();
</script>
